[project]
name = "j-svm"
version = "0.1.0"
description = ""
authors = [{ name = "keithlin" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy>=2.2.5,<3.0.0",
    "jax[cuda12]>=0.6.0,<1.0.0; sys_platform == 'linux'",
    "jax>=0.6.0,<1.0.0; sys_platform != 'linux'",
    "cvxpy>=1.6.5,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "black>=25.1.0,<26.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "ipywidgets>=8.1.7,<9.0.0",
    "matplotlib>=3.10.3,<4.0.0",
    "jaxtyping>=0.3.2,<1.0.0",
    "cvxpylayers>=0.1.9,<1.0.0",
    "joblib>=1.5.0,<2.0.0",
    "jaxopt>=0.8.5,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "pytest>=8.0.0,<9.0.0",
    "scikit-learn>=1.6.1,<2.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["SVM*", "JSVM*", "core*", "data*", "utils*"]
